<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sortclip">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="Exemples de clips générés automatiquement par l'IA de Sortclip à partir de podcasts et streams.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect x=%274%27 y=%274%27 width=%2756%27 height=%2756%27 rx=%2716%27 fill=%27%237c3aed%27/%3E%3Cpath d=%27M22 20 L22 44 L42 32 Z%27 fill=%27%230f0f14%27/%3E%3C/svg%3E">
<title>Exemples — Sortclip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<style>
  body{margin:0;background:#0f0f14;}
  a{color:inherit;text-decoration:none;}
</style>
</head>
<body>
<section style="position:relative;width:100%;min-height:100vh;background:#0f0f14;font-family:'Inter',sans-serif;color:#fff;padding:32px;box-sizing:border-box;">
  <div style="max-width:1240px;margin:0 auto;">
    <div id="nav-root"></div>
    <script type="module">
      import { renderNav } from './nav.js';
      renderNav({ active: 'exemples.html' });
    </script>

    <div style="text-align:center;max-width:640px;margin:0 auto 56px;">
      <h1 style="font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:700;margin:0 0 16px;">Des clips générés automatiquement par notre IA</h1>
      <p style="font-size:16px;color:#9ca3af;margin:0;">Voici quelques exemples de clips créés à partir de podcasts, streams et webinars.</p>
    </div>

    <div id="examples-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;margin-bottom:48px;"></div>

    <style>.tt-phone video::-webkit-media-controls{display:none;}</style>
    <script>
      // Vraies vidéos générées avec Sortclip, au format téléphone TikTok.
      (function () {
        const clips = [
          { src: 'examples/clip1.mp4', title: "On peut mourir ? Ça m'intéresse pas sinon", views: '512 k' },
          { src: 'examples/clip2.mp4', title: "Panique intérieure, tout lâche en même temps", views: '340 k' },
          { src: 'examples/clip3.mp4', title: "Panique totale, l'eau rentre dans la maison", views: '890 k' },
          { src: 'examples/clip4.mp4', title: "Le tremblement de terre me fait le plus peur", views: '128 k' },
          { src: 'examples/clip5.mp4', title: "Étienne attrape… MERDE MERDE", views: '740 k' },
          { src: 'examples/clip6.mp4', title: "Crever pour mon art dégueulasse", views: '265 k' },
          { src: 'https://kxnacycqaqhmvwdkprbq.supabase.co/storage/v1/object/public/examples/clip7.mp4', title: "Le moment qui a tout fait basculer", views: '410 k' },
          { src: 'https://kxnacycqaqhmvwdkprbq.supabase.co/storage/v1/object/public/examples/clip8.mp4', title: "Personne ne s'y attendait", views: '190 k' },
        ];
        const esc = (s) => String(s).replace(/[&<>"]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[m]));
        const ico = (svg, label) =>
          `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
             <div style="font-size:26px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));">${svg}</div>
             ${label ? `<span style="font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);">${label}</span>` : ''}
           </div>`;
        const slide = (c) => `
          <div class="tt-phone" style="position:relative;border-radius:28px;overflow:hidden;border:1px solid #2a2a35;background:#000;box-shadow:0 30px 60px rgba(0,0,0,.5);aspect-ratio:9/16;cursor:pointer;">
            <video src="${esc(c.src)}" preload="metadata" playsinline loop style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;"></video>
            <div style="position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;gap:18px;font-size:13px;color:#fff;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.7);">
              <span style="opacity:.65;">Abonnements</span>
              <span style="font-weight:800;border-bottom:2px solid #fff;padding-bottom:3px;">Pour toi</span>
            </div>
            <div style="position:absolute;right:8px;bottom:78px;display:flex;flex-direction:column;align-items:center;gap:16px;pointer-events:none;">
              <div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#f43f8e);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:16px;">🎬</div>
              ${ico('❤️', esc(c.views))}
              ${ico('💬', '')}
              ${ico('🔖', '')}
              ${ico('↪️', 'Partager')}
              <div style="width:34px;height:34px;border-radius:50%;background:#222;border:3px solid #111;display:flex;align-items:center;justify-content:center;font-size:14px;">🎵</div>
            </div>
            <div style="position:absolute;left:12px;right:64px;bottom:14px;color:#fff;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.8);">
              <div style="font-size:14px;font-weight:800;margin-bottom:4px;">@sortclip</div>
              <div style="font-size:12px;line-height:1.35;margin-bottom:6px;">${esc(c.title)}</div>
              <div style="font-size:11px;opacity:.9;">🎵 Son original — Sortclip</div>
            </div>
            <div class="tt-play" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;pointer-events:none;">▶</div>
          </div>`;
        const grid = document.getElementById('examples-grid');
        if (grid) {
          grid.innerHTML = clips.map(slide).join('');
          grid.querySelectorAll('.tt-phone').forEach((phone) => {
            const video = phone.querySelector('video');
            const play = phone.querySelector('.tt-play');
            phone.addEventListener('click', () => {
              if (video.paused) {
                document.querySelectorAll('video').forEach(v => { if (v !== video) v.pause(); });
                video.play();
              } else {
                video.pause();
              }
            });
            video.addEventListener('play', () => { play.style.display = 'none'; });
            video.addEventListener('pause', () => { play.style.display = 'flex'; });
          });
        }
      })();
    </script>

    <div style="text-align:center;">
      <a href="signup.html" style="background:#f43f8e;color:#fff;font-weight:700;font-size:14px;padding:14px 28px;border-radius:9999px;display:inline-block;">Créer mes propres clips</a>
    </div>
  </div>
</section>
<script type="module" src="auth-redirect.js"></script>
<div id="footer-root"></div>
<script type="module">import { renderFooter } from './nav.js'; renderFooter();</script>
<script type="module" src="/install-prompt.js"></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){});});}</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
