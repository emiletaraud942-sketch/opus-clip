<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sortclip">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="Retrouvez l'historique de vos clips générés par Sortclip.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect x=%274%27 y=%274%27 width=%2756%27 height=%2756%27 rx=%2716%27 fill=%27%237c3aed%27/%3E%3Cpath d=%27M22 20 L22 44 L42 32 Z%27 fill=%27%230f0f14%27/%3E%3C/svg%3E">
<title>Mes clips — Sortclip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<style>
  body{margin:0;background:#0f0f14;}
  a{color:inherit;text-decoration:none;}
</style>
</head>
<body>
<section style="position:relative;width:100%;min-height:100vh;background:#0f0f14;font-family:'Inter',sans-serif;color:#fff;padding:32px;box-sizing:border-box;">
  <div style="max-width:1240px;margin:0 auto;">
    <div id="nav-root"></div>
    <script type="module">
      import { renderNav } from './nav.js';
      renderNav({});
    </script>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <h1 style="font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;margin:0;">Mes clips</h1>
        <span id="plan-badge" style="display:none;background:rgba(244,63,142,.15);color:#f9a8c9;font-size:11px;font-weight:700;padding:4px 10px;border-radius:9999px;"></span>
      </div>
      <a href="index.html" style="background:#f43f8e;color:#fff;font-weight:700;font-size:13px;padding:10px 20px;border-radius:9999px;">+ Importer une vidéo</a>
    </div>

    <!-- Compteur d'usage : minutes d'abonnement + crédits -->
    <div id="usage-widget" style="display:none;background:#17171d;border:1px solid #2a2a35;border-radius:14px;padding:16px 20px;margin-bottom:32px;font-size:13px;color:#d1d5db;">
      <div style="display:flex;flex-wrap:wrap;gap:24px;align-items:center;">
        <div>
          <div style="color:#6b7280;font-size:12px;">Minutes d'abonnement</div>
          <div id="sub-minutes" style="font-size:20px;font-weight:700;color:#fff;font-family:'Space Grotesk',sans-serif;">—</div>
        </div>
        <div id="credit-block" style="display:none;">
          <div style="color:#6b7280;font-size:12px;">Crédits</div>
          <div id="credit-minutes" style="font-size:20px;font-weight:700;color:#c4b5fd;font-family:'Space Grotesk',sans-serif;">—</div>
          <div id="credit-expiry" style="font-size:11px;color:#6b7280;"></div>
        </div>
        <a href="tarifs.html" style="margin-left:auto;color:#f9a8c9;font-size:13px;text-decoration:underline;">Recharger / changer de plan</a>
      </div>
    </div>

    <div id="not-logged" style="display:none;text-align:center;padding:60px 20px;color:#9ca3af;">
      <p style="margin:0 0 16px;">Connecte-toi pour voir tes clips.</p>
      <a href="login.html" style="background:#f43f8e;color:#fff;font-weight:700;font-size:14px;padding:12px 24px;border-radius:9999px;">Connexion</a>
    </div>

    <div id="empty-state" style="display:none;text-align:center;padding:60px 20px;color:#9ca3af;">
      Aucun clip généré pour l'instant. Importe une vidéo depuis la page d'accueil pour commencer.
    </div>

    <!-- Bannières d'état des générations récentes (en cours / échec). -->
    <div id="job-status" style="display:none;margin-bottom:24px;"></div>

    <div id="clips-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;"></div>
  </div>
</section>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './supabase-config.js';
  import { ADJUST_URL } from './modal-config.js';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const PLAN_LABELS = { free: 'Gratuit', starter: 'Starter', pro: 'Pro', equipe: 'Équipe' };
  // Doit rester aligné avec pricing_config.py (PLANS[...].minutes).
  const PLAN_MINUTES = { free: 25, starter: 75, pro: 160, equipe: 450 };

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    document.getElementById('not-logged').style.display = 'block';
  } else {
    const { data: profile } = await supabase
      .from('profiles')
      .select('plan, minutes_used')
      .eq('user_id', session.user.id)
      .maybeSingle();
    const plan = profile?.plan || 'free';
    const planBadge = document.getElementById('plan-badge');
    planBadge.textContent = `Plan ${PLAN_LABELS[plan] || PLAN_LABELS.free}`;
    planBadge.style.display = 'inline-block';

    // Compteur d'usage : minutes d'abonnement restantes + crédits actifs.
    try {
      const subTotal = PLAN_MINUTES[plan] ?? PLAN_MINUTES.free;
      const subRemaining = Math.max(0, subTotal - (Number(profile?.minutes_used) || 0));
      document.getElementById('sub-minutes').textContent = `${Math.round(subRemaining)} / ${subTotal} min`;

      const nowIso = new Date().toISOString();
      const { data: packs } = await supabase
        .from('credit_packs')
        .select('minutes_remaining, expires_at')
        .eq('user_id', session.user.id)
        .gt('minutes_remaining', 0)
        .gte('expires_at', nowIso)
        .order('expires_at', { ascending: true });

      if (packs && packs.length) {
        const totalCredits = packs.reduce((s, p) => s + Number(p.minutes_remaining), 0);
        document.getElementById('credit-minutes').textContent = `${Math.round(totalCredits)} min`;
        const soonest = new Date(packs[0].expires_at).toLocaleDateString('fr-FR');
        document.getElementById('credit-expiry').textContent = `expire le ${soonest}`;
        document.getElementById('credit-block').style.display = 'block';
      }
      document.getElementById('usage-widget').style.display = 'block';
    } catch (e) {
      // Colonnes/table pas encore migrées : on masque le widget sans bloquer.
      console.warn('Compteur d\'usage indisponible :', e);
    }

    // État des générations récentes : une génération se lance en tâche de
    // fond ; si elle échoue, l'erreur est stockée dans clip_jobs mais n'était
    // jusqu'ici jamais montrée — d'où l'impression que « rien n'apparaît ».
    try {
      const dayAgo = new Date(Date.now() - 24 * 3600 * 1000).toISOString();
      const { data: jobs } = await supabase
        .from('clip_jobs')
        .select('status, error, created_at')
        .eq('user_id', session.user.id)
        .gte('created_at', dayAgo)
        .order('created_at', { ascending: false });
      if (jobs && jobs.length) {
        const processing = jobs.filter(j => j.status === 'processing').length;
        const failed = jobs.filter(j => j.status === 'error');
        const box = document.getElementById('job-status');
        let html = '';
        if (processing) {
          html += `<div style="background:rgba(139,92,246,.1);border:1px solid #3a2a55;border-radius:12px;padding:14px 16px;font-size:13px;color:#c4b5fd;margin-bottom:10px;">⏳ ${processing} génération${processing > 1 ? 's' : ''} en cours… Les clips apparaîtront ici automatiquement une fois le traitement terminé (recharge la page dans quelques minutes).</div>`;
        }
        if (failed.length) {
          const reason = (failed[0].error || 'raison inconnue').toString().slice(0, 300);
          html += `<div style="background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.4);border-radius:12px;padding:14px 16px;font-size:13px;color:#fca5a5;">⚠️ La dernière génération a échoué : <span style="color:#fecaca;"></span>. Tes minutes ont été recréditées, tu peux réessayer.</div>`;
          box.innerHTML = html;
          // On insère la raison via textContent pour éviter toute injection.
          box.querySelector('span').textContent = reason;
        } else {
          box.innerHTML = html;
        }
        if (html) box.style.display = 'block';
      }
    } catch (e) {
      console.warn('État des générations indisponible :', e);
    }

    const { data: clips, error } = await supabase
      .from('clips')
      .select('*')
      .eq('user_id', session.user.id)
      .order('created_at', { ascending: false });

    if (error) {
      // On n'affiche plus « aucun clip » quand c'est en réalité une erreur de
      // requête : on montre le vrai message pour pouvoir diagnostiquer.
      const empty = document.getElementById('empty-state');
      empty.style.display = 'block';
      empty.textContent = `Impossible de charger tes clips : ${error.message || error}. `
        + `Réessaie dans un instant ou recharge la page.`;
    } else if (!clips || clips.length === 0) {
      document.getElementById('empty-state').style.display = 'block';
    } else {
      const rows = clips;

      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, m => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]
      ));

      const safeName = (t) => (String(t || 'clip').replace(/[^\w-]+/g, '_').slice(0, 40) || 'clip') + '.mp4';
      const clipsById = Object.fromEntries(rows.map((c) => [c.id, c]));

      // Génère un lien signé FRAIS au moment du clic (les liens signés
      // expirent : les pré-générer au chargement provoque des « InvalidJWT ».
      async function freshUrl(path, downloadName) {
        const opts = downloadName ? { download: downloadName } : undefined;
        const { data, error } = await supabase.storage.from('clips').createSignedUrl(path, 120, opts);
        if (error || !data?.signedUrl) throw error || new Error('URL indisponible');
        return data.signedUrl;
      }

      // Compte à rebours d'expiration (plan gratuit : clips supprimés à 72 h).
      function expiryBadge(createdAt) {
        if (plan !== 'free') return '';
        const expires = new Date(createdAt).getTime() + 72 * 3600 * 1000;
        const hoursLeft = Math.floor((expires - Date.now()) / 3600000);
        if (hoursLeft <= 0) {
          return `<div style="margin-top:8px;font-size:11px;color:#fca5a5;">⏳ Supprimé très bientôt — passe à un plan payant pour conserver tes clips</div>`;
        }
        const color = hoursLeft <= 12 ? '#fca5a5' : '#9ca3af';
        return `<div style="margin-top:8px;font-size:11px;color:${color};">⏳ Expire dans ${hoursLeft} h (plan gratuit : clips gardés 72 h)</div>`;
      }

      const grid = document.getElementById('clips-grid');
      grid.innerHTML = rows.map(c => {
        const tags = Array.isArray(c.hashtags) ? c.hashtags : [];
        const tagsLine = tags.length ? tags.map(t => '#' + t).join(' ') : '';
        const captionBlock = c.caption ? `
          <div style="margin-top:12px;padding:10px;background:#0f0f14;border:1px solid #2a2a35;border-radius:10px;">
            <div style="font-size:12px;line-height:1.5;color:#d1d5db;">${esc(c.caption)}</div>
            ${tagsLine ? `<div style="font-size:11px;color:#8b5cf6;margin-top:6px;">${esc(tagsLine)}</div>` : ''}
            <button data-copy="${esc(c.caption + (tagsLine ? '\n\n' + tagsLine : ''))}"
              style="margin-top:8px;background:#2a2a35;color:#fff;border:0;font-size:11px;font-weight:700;padding:6px 12px;border-radius:9999px;cursor:pointer;">
              Copier la légende
            </button>
          </div>` : '';
        const dl = esc(safeName(c.title));
        return `
        <div style="background:#17171d;border:1px solid #2a2a35;border-radius:16px;padding:16px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
            <span style="font-size:14px;font-weight:700;line-height:1.4;">${esc(c.title ?? 'Clip généré')}</span>
            <span style="background:#f43f8e;font-size:11px;font-weight:800;padding:4px 10px;border-radius:9999px;white-space:nowrap;margin-left:8px;">${c.score ?? '?'}</span>
          </div>
          <div style="font-size:12px;color:#6b7280;margin-bottom:12px;">${new Date(c.created_at).toLocaleDateString('fr-FR')} · ${Math.round(c.end_time - c.start_time)}s</div>
          <div style="display:flex;gap:8px;">
            <button data-open="${esc(c.storage_path)}" style="flex:1;background:#2a2a35;color:#fff;border:0;font-size:12px;font-weight:700;padding:9px;border-radius:9999px;cursor:pointer;">▶ Ouvrir</button>
            <button data-download="${esc(c.storage_path)}" data-name="${dl}" style="flex:1;background:#f43f8e;color:#fff;border:0;font-size:12px;font-weight:700;padding:9px;border-radius:9999px;cursor:pointer;">⬇ Télécharger</button>
          </div>
          ${expiryBadge(c.created_at)}
          <div style="margin-top:8px;">
            <button data-protect="${c.id}" data-on="${c.protected ? '1' : '0'}"
              title="Protège la vidéo source de ce clip contre le nettoyage automatique (30 j). Nécessaire pour pouvoir ré-ajuster le clip plus tard."
              style="background:${c.protected ? '#1f2937' : 'transparent'};border:1px solid ${c.protected ? '#f59e0b' : '#3a3a48'};color:${c.protected ? '#fbbf24' : '#9ca3af'};font-size:11px;font-weight:700;padding:6px 12px;border-radius:9999px;cursor:pointer;">
              ${c.protected ? '🔒 Protégé' : '🔓 Protéger la source'}
            </button>
          </div>
          ${captionBlock}
          ${c.edl ? `
          <div style="margin-top:12px;padding:10px;background:#0f0f14;border:1px solid #2a2a35;border-radius:10px;">
            <div style="font-size:11px;color:#9ca3af;margin-bottom:6px;">Ajuster ce clip (texte)</div>
            <input data-adjust-input="${c.id}" placeholder="ex. « moins de zooms », « sous-titres plus gros », « en jaune »"
              style="width:100%;box-sizing:border-box;background:#17171d;border:1px solid #2a2a35;color:#fff;font-size:12px;padding:8px;border-radius:8px;" />
            <div style="display:flex;gap:8px;align-items:center;margin-top:6px;">
              <button data-adjust="${c.id}" data-rev="${c.edl_rev ?? 0}"
                style="background:#8b5cf6;color:#fff;border:0;font-size:11px;font-weight:700;padding:7px 14px;border-radius:9999px;cursor:pointer;">Ajuster</button>
              <button data-edit="${c.id}"
                style="background:#20202a;border:1px solid #3a3a48;color:#fff;font-size:11px;font-weight:700;padding:7px 14px;border-radius:9999px;cursor:pointer;">✏️ Timeline</button>
              <span data-adjust-status="${c.id}" style="font-size:11px;color:#9ca3af;"></span>
            </div>
            <div data-editor="${c.id}" style="display:none;margin-top:10px;"></div>
          </div>` : ''}
        </div>`;
      }).join('');

      grid.addEventListener('click', async (e) => {
        const copyBtn = e.target.closest('[data-copy]');
        if (copyBtn) {
          navigator.clipboard.writeText(copyBtn.getAttribute('data-copy')).then(() => {
            const prev = copyBtn.textContent;
            copyBtn.textContent = 'Copié ✓';
            setTimeout(() => { copyBtn.textContent = prev; }, 1500);
          });
          return;
        }

        const openBtn = e.target.closest('[data-open]');
        if (openBtn) {
          const prev = openBtn.textContent;
          openBtn.textContent = '…';
          try { window.open(await freshUrl(openBtn.getAttribute('data-open')), '_blank'); }
          catch { alert("Impossible d'ouvrir ce clip. Réessaie."); }
          openBtn.textContent = prev;
          return;
        }

        const dlBtn = e.target.closest('[data-download]');
        if (dlBtn) {
          const prev = dlBtn.textContent;
          dlBtn.textContent = '…';
          try {
            const url = await freshUrl(dlBtn.getAttribute('data-download'), dlBtn.getAttribute('data-name'));
            const a = document.createElement('a');
            a.href = url; a.download = dlBtn.getAttribute('data-name');
            document.body.appendChild(a); a.click(); a.remove();
          } catch { alert("Téléchargement impossible. Réessaie."); }
          dlBtn.textContent = prev;
          return;
        }

        // Protéger / déprotéger la vidéo source (empêche le nettoyage auto).
        const protBtn = e.target.closest('[data-protect]');
        if (protBtn) {
          const clipId = protBtn.getAttribute('data-protect');
          const next = protBtn.getAttribute('data-on') !== '1';
          const prev = protBtn.textContent;
          protBtn.textContent = '…'; protBtn.disabled = true;
          try {
            const { error } = await supabase.from('clips').update({ protected: next }).eq('id', clipId);
            if (error) throw error;
            protBtn.setAttribute('data-on', next ? '1' : '0');
            if (clipsById[clipId]) clipsById[clipId].protected = next;
            protBtn.textContent = next ? '🔒 Protégé' : '🔓 Protéger la source';
            protBtn.style.background = next ? '#1f2937' : 'transparent';
            protBtn.style.borderColor = next ? '#f59e0b' : '#3a3a48';
            protBtn.style.color = next ? '#fbbf24' : '#9ca3af';
          } catch {
            alert('Impossible de modifier la protection. Réessaie.');
            protBtn.textContent = prev;
          }
          protBtn.disabled = false;
          return;
        }

        // Ouvrir/fermer la timeline visuelle.
        const editBtn = e.target.closest('[data-edit]');
        if (editBtn) {
          const clipId = editBtn.getAttribute('data-edit');
          const box = grid.querySelector(`[data-editor="${clipId}"]`);
          if (box.style.display === 'none') {
            box.style.display = 'block';
            if (!box.dataset.built) { buildTimeline(clipId, box); box.dataset.built = '1'; }
          } else {
            box.style.display = 'none';
          }
          return;
        }

        // Ajustement par texte : envoie la consigne, puis attend la fin du
        // re-rendu en surveillant edl_rev.
        const adjBtn = e.target.closest('[data-adjust]');
        if (adjBtn) {
          const clipId = adjBtn.getAttribute('data-adjust');
          const input = grid.querySelector(`[data-adjust-input="${clipId}"]`);
          const status = grid.querySelector(`[data-adjust-status="${clipId}"]`);
          const instruction = (input?.value || '').trim();
          if (!instruction) { status.style.color = '#fca5a5'; status.textContent = 'Écris une consigne.'; return; }
          adjBtn.disabled = true; status.style.color = '#9ca3af'; status.textContent = 'Envoi…';
          try {
            const { data: { session } } = await supabase.auth.getSession();
            const res = await fetch(ADJUST_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
              body: JSON.stringify({ clipId, instruction }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) { status.style.color = '#fca5a5'; status.textContent = data.error || 'Échec.'; adjBtn.disabled = false; return; }
            const baseRev = data.rev ?? (Number(adjBtn.getAttribute('data-rev')) || 0);
            status.textContent = ((data.notes || []).join(' · ') || 'Ajustement') + ' — re-rendu en cours…';
            let tries = 0;
            const poll = setInterval(async () => {
              tries += 1;
              const { data: row } = await supabase.from('clips').select('edl_rev').eq('id', clipId).maybeSingle();
              if (row && Number(row.edl_rev) > baseRev) {
                clearInterval(poll); status.style.color = '#86efac';
                status.textContent = 'Clip mis à jour ✓ — rouvre-le pour voir.';
                adjBtn.disabled = false; adjBtn.setAttribute('data-rev', String(row.edl_rev));
              } else if (tries > 40) {
                clearInterval(poll); status.style.color = '#fca5a5';
                status.textContent = 'Délai dépassé — réessaie.'; adjBtn.disabled = false;
              }
            }, 3000);
          } catch {
            status.style.color = '#fca5a5'; status.textContent = 'Erreur réseau.'; adjBtn.disabled = false;
          }
        }
      });

      // Timeline visuelle : pastilles de cadrage déplaçables. L'édition modifie
      // directement l'EDL (aucun appel LLM), puis /adjust re-rend.
      function buildTimeline(clipId, box) {
        const c = clipsById[clipId];
        const edl = c.edl || {};
        const events = edl.events || [];
        const outDur = (edl.keeps || []).reduce((s, k) => s + (k.end - k.start), 0)
          || Math.max(1, (c.end_time - c.start_time) || 1);
        const COLORS = { wide: '#3b82f6', medium: '#8b5cf6', tight: '#f43f8e' };
        // Libellés français affichés à l'utilisateur (la valeur interne reste
        // en anglais, attendue par le moteur de rendu).
        const LABELS = { wide: 'Plan large', medium: 'Plan moyen', tight: 'Gros plan' };
        const ORDER = ['wide', 'medium', 'tight'];
        let framings = events.filter(e => e.op === 'framing').map(e => ({ ...e }));
        const others = events.filter(e => e.op !== 'framing');   // emphases… préservés

        box.innerHTML = `
          <div style="font-size:12px;color:#d1d5db;line-height:1.55;margin-bottom:8px;">
            <strong style="color:#fff;">Réglez le cadrage tout au long du clip.</strong>
            Chaque pastille marque le moment où l'image passe à un cadrage donné. Trois choix possibles :
            <span style="display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;">
              <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:50%;background:#3b82f6;"></span><strong style="color:#fff;">Plan large</strong> — on voit toute la scène</span>
              <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:50%;background:#8b5cf6;"></span><strong style="color:#fff;">Plan moyen</strong> — cadrage rapproché</span>
              <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:50%;background:#f43f8e;"></span><strong style="color:#fff;">Gros plan</strong> — zoom serré sur le visage</span>
            </span>
          </div>
          <div style="font-size:11px;color:#9ca3af;margin-bottom:6px;">La barre représente la durée du clip : <strong style="color:#d1d5db;">gauche = début, droite = fin</strong>. La position d'une pastille indique donc <strong style="color:#d1d5db;">à quel instant</strong> ce cadrage démarre (et il reste actif jusqu'à la pastille suivante).</div>
          <div style="font-size:11px;color:#9ca3af;margin-bottom:6px;">Glissez une pastille pour déplacer ce moment · cliquez dessus pour changer de cadrage (Plan large → Plan moyen → Gros plan) · × pour la retirer.</div>
          <div data-track style="position:relative;height:56px;background:#0f0f14;border:1px solid #2a2a35;border-radius:8px;overflow:hidden;touch-action:none;user-select:none;"></div>
          <div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap;">
            <button data-add style="background:#20202a;border:1px solid #3a3a48;color:#fff;font-size:11px;font-weight:700;padding:6px 12px;border-radius:9999px;cursor:pointer;">+ Ajouter un cadrage</button>
            <button data-save style="background:#8b5cf6;border:0;color:#fff;font-size:11px;font-weight:700;padding:6px 14px;border-radius:9999px;cursor:pointer;">Enregistrer</button>
            <span data-tl-status style="font-size:11px;color:#9ca3af;"></span>
          </div>`;
        const track = box.querySelector('[data-track]');
        const status = box.querySelector('[data-tl-status]');

        function renderPills() {
          track.innerHTML = '';
          others.forEach(em => {
            const pct = Math.min(100, Math.max(0, (em.t / outDur) * 100));
            const d = document.createElement('div');
            d.title = 'emphase';
            d.style.cssText = `position:absolute;left:${pct}%;top:6px;width:8px;height:8px;border-radius:50%;background:#22e5ff;transform:translateX(-50%);`;
            track.appendChild(d);
          });
          framings.forEach((f, idx) => {
            const pct = Math.min(100, Math.max(0, (f.t / outDur) * 100));
            const pill = document.createElement('div');
            pill.dataset.idx = String(idx);
            pill.style.cssText = `position:absolute;left:${pct}%;top:20px;transform:translateX(-50%);background:${COLORS[f.value] || '#8b5cf6'};color:#fff;font-size:10px;font-weight:800;padding:4px 8px;border-radius:9999px;cursor:grab;white-space:nowrap;display:flex;align-items:center;gap:6px;`;
            pill.innerHTML = `<span data-cycle>${LABELS[f.value] || f.value}</span><span data-del style="cursor:pointer;opacity:.85;">×</span>`;
            track.appendChild(pill);
            let dragging = false, startX = 0;
            pill.addEventListener('pointerdown', ev => {
              if (ev.target.hasAttribute('data-del')) return;
              dragging = true; pill.dataset.moved = ''; startX = ev.clientX;
              pill.setPointerCapture(ev.pointerId);
              pill.style.cursor = 'grabbing';
            });
            pill.addEventListener('pointermove', ev => {
              if (!dragging) return;
              // Seuil : en dessous de 5 px, c'est un clic, pas un glisser — sinon
              // le moindre tremblement empêchait de cliquer pour changer le cadrage.
              if (pill.dataset.moved !== '1' && Math.abs(ev.clientX - startX) < 5) return;
              pill.dataset.moved = '1';
              const r = track.getBoundingClientRect();
              let x = (ev.clientX - r.left) / r.width; x = Math.min(1, Math.max(0, x));
              f.t = +(x * outDur).toFixed(2); pill.style.left = `${x * 100}%`;
            });
            pill.addEventListener('pointerup', () => { dragging = false; pill.style.cursor = 'grab'; });
          });
        }

        track.addEventListener('click', ev => {
          const pill = ev.target.closest('[data-idx]'); if (!pill) return;
          const idx = +pill.dataset.idx;
          if (ev.target.closest('[data-del]')) { framings.splice(idx, 1); renderPills(); return; }
          if (pill.dataset.moved === '1') { pill.dataset.moved = ''; return; }  // c'était un glisser
          // Clic simple n'importe où sur la pastille → change le cadrage
          // (Plan large → Plan moyen → Gros plan).
          const cur = framings[idx].value;
          framings[idx].value = ORDER[(ORDER.indexOf(cur) + 1) % ORDER.length];
          renderPills();
        });

        box.querySelector('[data-add]').addEventListener('click', () => {
          framings.push({ op: 'framing', t: +(outDur / 2).toFixed(2), value: 'tight', transition: 'cut' });
          renderPills();
        });

        box.querySelector('[data-save]').addEventListener('click', async () => {
          status.style.color = '#9ca3af'; status.textContent = 'Enregistrement…';
          const payloadEvents = [
            ...framings.map(f => ({ op: 'framing', t: f.t, value: f.value, transition: f.transition || 'cut', ...(f.id ? { id: f.id } : {}) })),
            ...others,
          ];
          try {
            const { data: { session } } = await supabase.auth.getSession();
            const res = await fetch(ADJUST_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
              body: JSON.stringify({ clipId, events: payloadEvents }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) { status.style.color = '#fca5a5'; status.textContent = data.error || 'Échec.'; return; }
            const baseRev = data.rev ?? (c.edl_rev || 0);
            status.textContent = 'Re-rendu en cours…';
            let tries = 0;
            const poll = setInterval(async () => {
              tries += 1;
              const { data: row } = await supabase.from('clips').select('edl_rev').eq('id', clipId).maybeSingle();
              if (row && Number(row.edl_rev) > baseRev) {
                clearInterval(poll); status.style.color = '#86efac';
                status.textContent = 'Mis à jour ✓ — rouvre le clip.';
              } else if (tries > 40) {
                clearInterval(poll); status.style.color = '#fca5a5'; status.textContent = 'Délai dépassé.';
              }
            }, 3000);
          } catch {
            status.style.color = '#fca5a5'; status.textContent = 'Erreur réseau.';
          }
        });

        renderPills();
      }
    }
  }
</script>
