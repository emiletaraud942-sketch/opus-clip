<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Créez votre compte Sortclip gratuitement et commencez à transformer vos vidéos en clips viraux.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect x=%274%27 y=%274%27 width=%2756%27 height=%2756%27 rx=%2716%27 fill=%27%237c3aed%27/%3E%3Cpath d=%27M22 20 L22 44 L42 32 Z%27 fill=%27%230f0f14%27/%3E%3C/svg%3E">
<title>Inscription — Sortclip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<style>
  body{margin:0;background:#0f0f14;}
  a{color:inherit;text-decoration:none;}
  input:focus{outline:none;border-color:#f43f8e !important;}
  .signup-btn:hover{background:#e02f7d;}
</style>
</head>
<body>
<section style="position:relative;width:100%;min-height:100vh;background:#0f0f14;font-family:'Inter',sans-serif;color:#fff;padding:32px;box-sizing:border-box;">
  <div style="max-width:1240px;margin:0 auto;">
    <div id="nav-root"></div>
    <script type="module">
      import { renderNav } from './nav.js';
      renderNav({ ctaVariant: 'signup' });
    </script>
  </div>

  <div style="max-width:420px;margin:20px auto 0;">
    <div style="text-align:center;margin-bottom:32px;">
      <h1 style="font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;margin:0 0 10px;">Créez votre compte</h1>
      <p style="font-size:14px;color:#9ca3af;margin:0;">25 min de vidéo offertes / mois · Aucune carte bancaire requise</p>
    </div>

    <div id="error-box" style="display:none;background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.4);color:#fca5a5;font-size:13px;padding:12px 14px;border-radius:10px;margin-bottom:16px;"></div>
    <div id="success-box" style="display:none;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.4);color:#86efac;font-size:13px;padding:12px 14px;border-radius:10px;margin-bottom:16px;"></div>

    <form id="signup-form" style="background:#17171d;border:1px solid #2a2a35;border-radius:20px;padding:28px;box-sizing:border-box;">
      <label style="display:block;font-size:13px;color:#d1d5db;margin-bottom:6px;">Nom complet</label>
      <input type="text" name="name" id="name" required placeholder="Jean Dupont"
        style="width:100%;background:#0f0f14;border:1px solid #2a2a35;color:#fff;font-size:14px;padding:12px 14px;border-radius:10px;box-sizing:border-box;margin-bottom:18px;" />

      <label style="display:block;font-size:13px;color:#d1d5db;margin-bottom:6px;">Adresse e-mail</label>
      <input type="email" name="email" id="email" required placeholder="vous@exemple.com"
        style="width:100%;background:#0f0f14;border:1px solid #2a2a35;color:#fff;font-size:14px;padding:12px 14px;border-radius:10px;box-sizing:border-box;margin-bottom:18px;" />

      <label style="display:block;font-size:13px;color:#d1d5db;margin-bottom:6px;">Mot de passe</label>
      <input type="password" name="password" id="password" required minlength="8" placeholder="8 caractères minimum"
        style="width:100%;background:#0f0f14;border:1px solid #2a2a35;color:#fff;font-size:14px;padding:12px 14px;border-radius:10px;box-sizing:border-box;margin-bottom:22px;" />

      <button type="submit" id="signup-submit" class="signup-btn"
        style="width:100%;background:#f43f8e;color:#fff;font-weight:700;font-size:14px;padding:13px;border:none;border-radius:9999px;cursor:pointer;margin-bottom:16px;">
        S'inscrire gratuitement
      </button>

      <div style="font-size:12px;color:#6b7280;text-align:center;line-height:1.6;">
        En vous inscrivant, vous acceptez nos <a href="cgu.html" style="color:#9ca3af;text-decoration:underline;">Conditions d'utilisation</a>,
        nos <a href="cgv.html" style="color:#9ca3af;text-decoration:underline;">Conditions générales de vente</a>
        et notre <a href="politique-confidentialite.html" style="color:#9ca3af;text-decoration:underline;">Politique de confidentialité</a>.
      </div>
    </form>

    <div style="display:flex;align-items:center;gap:12px;margin:24px 0;">
      <div style="flex:1;height:1px;background:#2a2a35;"></div>
      <span style="font-size:12px;color:#6b7280;">ou</span>
      <div style="flex:1;height:1px;background:#2a2a35;"></div>
    </div>

    <button id="google-signup" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#17171d;border:1px solid #2a2a35;color:#fff;font-size:14px;font-weight:600;padding:12px;border-radius:9999px;cursor:pointer;">
      Continuer avec Google
    </button>
  </div>
</section>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './supabase-config.js';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const errorBox = document.getElementById('error-box');
  const successBox = document.getElementById('success-box');
  function showError(message) {
    successBox.style.display = 'none';
    errorBox.textContent = message;
    errorBox.style.display = 'block';
  }
  function showSuccess(message) {
    errorBox.style.display = 'none';
    successBox.textContent = message;
    successBox.style.display = 'block';
  }

  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    successBox.style.display = 'none';
    const submitBtn = document.getElementById('signup-submit');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Création du compte...';

    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: { data: { full_name: name } }
    });

    submitBtn.disabled = false;
    submitBtn.textContent = "S'inscrire gratuitement";

    if (error) {
      showError(error.message);
      return;
    }

    if (data.session) {
      window.location.href = 'index.html';
      return;
    }

    document.getElementById('signup-form').reset();
    showSuccess("Compte créé ! Vérifie ta boîte mail et clique sur le lien de confirmation avant de te connecter.");
  });

  document.getElementById('google-signup').addEventListener('click', async () => {
    errorBox.style.display = 'none';
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/index.html' }
    });
    if (error) showError(error.message);
  });
</script>
<div id="footer-root"></div>
<script type="module">import { renderFooter } from './nav.js'; renderFooter();</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
