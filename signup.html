<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscription — Sortclip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#0f0f14;}
  a{color:inherit;text-decoration:none;}
  input:focus{outline:none;border-color:#f43f8e !important;}
  .signup-btn:hover{background:#e02f7d;}
</style>
</head>
<body>
<section style="position:relative;width:100%;min-height:100vh;background:#0f0f14;font-family:'Inter',sans-serif;color:#fff;padding:32px;box-sizing:border-box;">
  <div style="max-width:1240px;margin:0 auto;">
    <nav style="display:flex;align-items:center;justify-content:space-between;padding:20px 0 60px;">
      <a href="index.html" style="display:flex;align-items:center;gap:10px;">
        <svg width="32" height="32" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="56" height="56" rx="16" fill="#7c3aed"/>
          <path d="M22 20 L22 44 L42 32 Z" fill="#0f0f14"/>
          <rect x="41" y="18" width="6" height="10" rx="3" fill="#0f0f14" transform="rotate(28 44 23)"/>
          <rect x="41" y="36" width="6" height="10" rx="3" fill="#0f0f14" transform="rotate(-28 44 41)"/>
        </svg>
        <span style="font-weight:700;font-size:19px;font-family:'Space Grotesk',sans-serif;">Sortclip</span>
      </a>
      <div style="display:flex;gap:32px;font-size:14px;color:#9ca3af;align-items:center;">
        <a href="fonctionnalites.html">Fonctionnalités</a>
        <a href="tarifs.html">Tarifs</a>
        <a href="exemples.html">Exemples</a>
        <span>Déjà un compte ?</span>
        <a href="login.html" style="color:#fff;font-weight:700;padding:10px 20px;border-radius:9999px;border:1px solid #2a2a35;">Connexion</a>
      </div>
    </nav>
  </div>

  <div style="max-width:420px;margin:20px auto 0;">
    <div style="text-align:center;margin-bottom:32px;">
      <h1 style="font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;margin:0 0 10px;">Créez votre compte</h1>
      <p style="font-size:14px;color:#9ca3af;margin:0;">3 vidéos offertes · Aucune carte bancaire requise</p>
    </div>

    <form action="#" method="post" style="background:#17171d;border:1px solid #2a2a35;border-radius:20px;padding:28px;box-sizing:border-box;">
      <label style="display:block;font-size:13px;color:#d1d5db;margin-bottom:6px;">Nom complet</label>
      <input type="text" name="name" required placeholder="Jean Dupont"
        style="width:100%;background:#0f0f14;border:1px solid #2a2a35;color:#fff;font-size:14px;padding:12px 14px;border-radius:10px;box-sizing:border-box;margin-bottom:18px;" />

      <label style="display:block;font-size:13px;color:#d1d5db;margin-bottom:6px;">Adresse e-mail</label>
      <input type="email" name="email" required placeholder="vous@exemple.com"
        style="width:100%;background:#0f0f14;border:1px solid #2a2a35;color:#fff;font-size:14px;padding:12px 14px;border-radius:10px;box-sizing:border-box;margin-bottom:18px;" />

      <label style="display:block;font-size:13px;color:#d1d5db;margin-bottom:6px;">Mot de passe</label>
      <input type="password" name="password" required minlength="8" placeholder="8 caractères minimum"
        style="width:100%;background:#0f0f14;border:1px solid #2a2a35;color:#fff;font-size:14px;padding:12px 14px;border-radius:10px;box-sizing:border-box;margin-bottom:22px;" />

      <button type="submit" class="signup-btn"
        style="width:100%;background:#f43f8e;color:#fff;font-weight:700;font-size:14px;padding:13px;border:none;border-radius:9999px;cursor:pointer;margin-bottom:16px;">
        S'inscrire gratuitement
      </button>

      <div style="font-size:12px;color:#6b7280;text-align:center;line-height:1.6;">
        En vous inscrivant, vous acceptez nos <a href="#" style="color:#9ca3af;text-decoration:underline;">Conditions d'utilisation</a>
        et notre <a href="#" style="color:#9ca3af;text-decoration:underline;">Politique de confidentialité</a>.
      </div>
    </form>

    <div style="display:flex;align-items:center;gap:12px;margin:24px 0;">
      <div style="flex:1;height:1px;background:#2a2a35;"></div>
      <span style="font-size:12px;color:#6b7280;">ou</span>
      <div style="flex:1;height:1px;background:#2a2a35;"></div>
    </div>

    <a href="#" style="display:flex;align-items:center;justify-content:center;gap:10px;background:#17171d;border:1px solid #2a2a35;color:#fff;font-size:14px;font-weight:600;padding:12px;border-radius:9999px;">
      Continuer avec Google
    </a>
  </div>
</section>
</body>
</html>
